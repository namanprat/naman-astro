name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    steps:
      - name: Check or sign CLA
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        # contributor-assistant/github-action v2.6.1, pinned to its commit SHA
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/lumosframework/lumos-for-astro/blob/main/CLA.md
          path-to-signatures: .github/cla-signatures.json
          branch: main
          allowlist: lumosframework,*[bot]
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Thanks for your pull request. Before it can be merged, please read
            the [Contributor License Agreement](https://github.com/lumosframework/lumos-for-astro/blob/main/CLA.md)
            and sign it by posting the comment below. This is a one-time step
            that covers all of your future contributions.
