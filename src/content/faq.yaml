faq:
  statement: We take on fewer projects so we can be fully present on each one.
    Every layer earns its place before we move to the next.
  lead: Here's what's worth knowing before we start.
  items:
    - question: Who will actually be working on the project?
      answer: "We lead every project: strategy, creative direction, and your point
        of contact throughout. Depending on scope, a few trusted collaborators
        help on design and build. You get us in the work with you, not a vendor
        you brief and wait on. Small projects get the same attention as large
        ones."
    - question: How long do projects usually take?
      answer: Most projects run 10 to 14 weeks start to finish. Timelines move
        with scope, but milestones are set on day one so nothing catches you off
        guard.
    - question: How do you keep me in the loop?
      answer: Simple and transparent. You get written updates as things move,
        plus a weekly check-in, and we get on a call for the decisions that
        actually need one. We'll work in whatever tools you already use.
    - question: What do you need to start?
      answer: We get on a call, you tell us what you need, and we send back a
        proposal built for it. Then a signed agreement and the deposit. That's
        it. Onboarding stays short so we can get to the actual work.
    - question: What happens after launch?
      answer: A stretch of hands-on support while everything settles, plus notes
        clear enough that you can update it yourself. After that it's yours to
        run. If you'd rather we stay on, that's a separate conversation.
    - question: Can you handle branding, design and development?
      answer: Yes, and doing them together is the point. Story, identity, visuals
        and build line up from day one, so what you end up with is one thing
        instead of three handoffs.
    - question: Who do you work with?
      answer: Early-stage brands and startups, usually right before they meet the
        world properly for the first time. We're in Mumbai and Bangalore, and
        work with clients anywhere. If you'd rather not look like every other
        company in your category, that's the brief.
