panels:
  - kind: image
    src: /work/money-me/money-cover.webp
    alt: money.me cover
  - kind: text
    title: Why this, why now
    body: "Financial management is one of the most quietly consequential life
      skills a person picks up, or doesn't. Knowing how to hold the line
      between what comes in and what goes out shapes the texture of an entire
      decade, not a single month. But the further into independence you get,
      the harder that ledger is to hold in your head. Income arrives in
      fragments. Expenses leak through a dozen apps, cards, and casual taps.
      Without a way to see it cleanly, small decisions stack into a pattern:
      irresponsible by accident, not by intention. money.me started from that
      observation. Not as another budgeting app but as a way to give people
      back the visibility they had stopped expecting from their phones. We
      worked with the money.me team to turn that idea into something real."
  - kind: image
    src: /work/money-me/strip-01.png
    alt: money.me interface strip
  - kind: text
    title: Listening before designing
    body: "Before drawing a single screen, we wanted to understand how people
      actually live with their money. We built a questionnaire and ran it
      across a small but varied group of users: students just managing their
      first stipend, working professionals juggling two or three cards, and
      friends who treated splitting a dinner bill like a small group project.
      The conversations probed the things you only learn by asking: how they
      keep track of expenses (or pretend to), how often they impulse buy and
      whether they regret it, how many cards live in their wallet, whether
      they had ever installed a money app and what made them open it less and
      less, and how a group actually splits a bill when the waiter brings the
      check. The aim was less to confirm a feature list and more to find the
      friction worth designing around."
  - kind: image
    src: /work/money-me/strip-02.png
    alt: money.me research screens
  - kind: text
    title: What people actually said
    body: "People wanted to save, time as much as money, and they wanted financial
      apps to make life easier, not noisier. Several said outright that every
      app they had tried felt the same, and that managing their finances
      mattered to them but they couldn't seem to be regular about it.
      Underneath the surface, they were asking for control. They wanted
      simple, efficient ways to handle the awkward bits: splitting a bill,
      paying back a friend, capturing a transaction without thinking about it.
      They wished their app actually knew them, when a transaction happened,
      where, and what it meant. What they did was telling. Most fell back on
      bank statements at the end of the month, or kept a half-hearted log they
      updated for a week and abandoned. Plenty had tried multiple money apps
      and kept none. The same problems came up every time: no way to ask the
      app how much they had spent on food this month, entering income and
      expenses was unclear enough to put people off, alerts arrived too late
      or not at all, and no one wanted to install another app just to remember
      to open it."
  - kind: image
    src: /work/money-me/strip-03.png
    alt: money.me product flow
  - kind: text
    title: The moneymaker
    body: "The goal that came out of the research was unusually simple: the app
      should ask less of the user, not more. Logging an expense should be
      something that has already happened by the time you look at the screen.
      The first move was to lean on something the user already gets for free:
      the transaction SMS their bank sends every time their card moves.
      money.me reads those messages on-device, parses them into categorised
      entries, and quietly fills the ledger. No manual entry, no forgotten
      lunches, no abandoned spreadsheets. On top of that runs a layer of small
      smart nudges. Instead of a single end-of-month notification telling you
      that you overspent, the app surfaces patterns as they form: a category
      creeping up, a recurring charge you forgot about, a place to trim
      without changing how you actually live. The tone is closer to a friend
      pointing something out than a bank warning you. The savings that come
      out of those nudges don't sit abstract. They slide into a Piggy Bank the
      user sets up, a container with a name and a goal, where the money saved
      in one place reappears as progress somewhere else. The point is to make
      saving feel like watching something grow, not giving something up."
  - kind: image
    src: /work/money-me/strip-04.png
    alt: money.me piggy bank
  - kind: image
    src: /work/money-me/strip-05.png
    alt: money.me final screens
